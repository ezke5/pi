{% comment %}
  _includes/head.html — everything inside <head>.
  An "include" is a reusable fragment pasted into a layout with the Liquid include tag.
{% endcomment %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title }}</title>
<meta name="description" content="{{ site.description | escape }}">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,"><!-- empty icon: avoids a pointless 404 request -->

<!--
  Apply the saved theme and font size BEFORE first paint, so the page never
  flashes the wrong colours. Tiny, inline, no dependencies.
-->
<script>
  (function () {
    try {
      var t = localStorage.getItem("book-theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
      var s = parseFloat(localStorage.getItem("book-size"));
      if (s) document.documentElement.style.setProperty("--size", s + "px");
    } catch (e) {}
  })();
</script>

<!-- relative_url prepends `baseurl`, so links work both locally and on GitHub Pages. -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
